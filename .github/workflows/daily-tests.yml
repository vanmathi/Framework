name: Daily Tests Run

on:
  schedule:
    - cron: "0 8 * * *"   # 1:30 PM IST
  workflow_dispatch:

jobs:
  run-daily-task:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Tests
        run: |
          echo "Running tests..."
          mvn clean test -Dsurefire.suiteXmlFiles=daily-suite.xml
