name: Daily Tests Run

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  run-daily-task:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install latest Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Tests
        run: mvn clean test -Dsurefire.suiteXmlFiles=daily-suite.xml
